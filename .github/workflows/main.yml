name: Build, Publish (dev), Tag

on:
  # Deliberately not auto-triggered on push to main yet — this whole
  # workflow (publish + tag) is built and ready, but staying manual-only
  # (workflow_dispatch) until we're ready to actually start publishing dev
  # builds. To go live: replace this with
  #   push:
  #     branches: [main]
  workflow_dispatch: {}

permissions:
  contents: write # push the git tag
  packages: write # publish to GitHub Packages

jobs:
  build-publish-tag:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4

      - uses: actions/setup-node@v4
        with:
          node-version: '20'
          cache: 'npm'
          # Scopes *only* @get-enlace-prefixed packages to GitHub Packages —
          # ordinary deps (express, react, ...) still resolve from the
          # public npm registry via this same install.
          registry-url: 'https://npm.pkg.github.com'
          scope: '@get-enlace'

      - run: npm ci
      - run: npm run typecheck
      - run: npm test
      - run: npm run build

      # This repo produces two packages, @get-enlace/ui and
      # @get-enlace/express, both publishable now (no longer the now-stale
      # "which package(s) to publish" question this comment used to flag —
      # both are). They're versioned in lockstep: @get-enlace/express
      # depends on an *exact* version of @get-enlace/ui, so both must land
      # on the same dev version together, computed once from @get-enlace/ui
      # as the source of truth.
      - name: Compute dev build version
        id: version
        run: echo "dev_version=$(node -p "require('./packages/enlace-ui/package.json').version")-dev.${{ github.run_number }}" >> "$GITHUB_OUTPUT"

      # Pure JSON edits (`npm pkg set`), not `npm version`: `npm version`
      # doesn't propagate a workspace's new version into other workspaces
      # that depend on it, and it additionally tries a registry lookup that
      # fails here, since this scope only resolves against GitHub Packages,
      # not the public npm registry.
      - name: Bump both packages to the dev version
        run: |
          npm pkg set version=${{ steps.version.outputs.dev_version }} --workspace @get-enlace/ui
          npm pkg set dependencies.@get-enlace/ui=${{ steps.version.outputs.dev_version }} --workspace @get-enlace/express
          npm pkg set version=${{ steps.version.outputs.dev_version }} --workspace @get-enlace/express

      # @get-enlace/ui first — @get-enlace/express's manifest now points at
      # this exact dev version, so it must exist on the registry before
      # @get-enlace/express is published.
      - name: Publish @get-enlace/ui to GitHub Packages (dev dist-tag)
        run: npm publish --workspace @get-enlace/ui --tag dev
        env:
          NODE_AUTH_TOKEN: ${{ secrets.GITHUB_TOKEN }}

      # Publish must succeed before the tag is ever created — if either
      # publish step fails, the job stops here (GitHub Actions' default: a
      # failed step halts the job), so the tag-push step below never runs.
      - name: Publish @get-enlace/express to GitHub Packages (dev dist-tag)
        run: npm publish --workspace @get-enlace/express --tag dev
        env:
          NODE_AUTH_TOKEN: ${{ secrets.GITHUB_TOKEN }}

      # Only reached if publish succeeded. Plain tag push — no GitHub
      # Release is created, matching "no release, only tag". No
      # retry/re-run handling: a genuine version collision (e.g. a manual
      # re-run of a workflow attempt whose publish already succeeded) is
      # left to fail loudly rather than special-cased.
      - name: Tag this build
        run: |
          git config user.name "github-actions[bot]"
          git config user.email "github-actions[bot]@users.noreply.github.com"
          git tag "v${{ steps.version.outputs.dev_version }}"
          git push origin "v${{ steps.version.outputs.dev_version }}"
